name: Package
on:
  push:
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      package_linux:
        description: Create Linux package
        type: boolean
        default: true
      package_macos:
        description: Create MacOS package
        type: boolean
        default: true
      package_windows:
        description: Create Windows package
        type: boolean
        default: true

jobs:
  package_linux_x64:
    name: Package (Linux X64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/') || inputs.package_linux == true

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21
          cache: 'maven'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main-linux"
      - name: Prepare packaging
        run: make prerequisites
      - name: Package
        run: |
          sudo apt install libdbus-1-dev pkg-config
          xvfb-run make package
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-package
          path: |
            target/popcorn-time_*.deb
            target/patch_*.tar.gz

  package_linux_arm64:
    name: Package (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/') || inputs.package_linux == true

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21
          cache: 'maven'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main-linux"
      - name: Prepare packaging
        run: make prerequisites
      - name: Package
        run: |
          sudo apt install libdbus-1-dev pkg-config
          xvfb-run make package
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-package
          path: |
            target/popcorn-time_*.deb
            target/patch_*.tar.gz

  package_macos_x64:
    name: Package (MacOS X64)
    runs-on: macos-15-intel
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/') || inputs.package_macos == true

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21
          cache: 'maven'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main-macos"
      - name: Prepare packaging
        run: make prerequisites
      - name: Package
        run: make package
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-package
          path: |
            target/popcorn-time_*.dmg
            target/patch_*.tar.gz

  package_macos_arm64:
    name: Package (MacOS ARM64)
    runs-on: macos-latest
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/') || inputs.package_macos == true

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21
          cache: 'maven'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main-macos"
      - name: Prepare packaging
        run: make prerequisites
      - name: Package
        run: make package
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-package
          path: |
            target/popcorn-time_*.dmg
            target/patch_*.tar.gz
  
  package_windows:
    name: Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/') || inputs.package_windows == true

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: 21
          cache: 'maven'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main-windows"
      - name: Prepare libraries
        run: cd ./assets/windows && ./prepare-libs.bat
      - name: Prepare packaging
        run: make prerequisites
      - name: Package
        run: make package
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            target/popcorn-time_*.exe
            target/patch_*.tar.gz